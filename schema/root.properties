quiz_title = lemmikkivisa: koirat ja kissat
quiz_intro = vastaa seuraaviin koiria ja kissoja koskeviin kysymyksiin. kun olet lähettänyt vastauksen, kenttä lukitaan ja saat palautteen.
quiz_submit = lähetä vastaus
quiz_reset = tyhjennä kaikki vastaukset
quiz_correct_label = oikein
quiz_incorrect_label = kaipaa parannusta
quiz_answer_placeholder = kirjoita vastauksesi tähän...
quiz_q_1 = mistä siperianhusky-rotu on alun perin kotoisin?
quiz_q_2 = mikä on sisäkissan keskimääräinen elinikä?
quiz_q_3 = miksi kissat kehräävät? kuvaile mahdollisia syitä.
quiz_q_4 = kuvaile, miten koiran hajuaisti vertautuu ihmisen hajuaistiin, ja anna esimerkki sen käytöstä.
quiz_q_5 = mikä on kissan viiksikarvojen tehtävä?
quiz_q_6 = mikä oli ensimmäisen avaruuteen lähetetyn koiran nimi?
quiz_q_7 = anna yksi vinkki henkilölle, joka kouluttaa pentua ensimmäistä kertaa.
quiz_q_8 = miten erotat rentoutuneen kissan uhatusta? kuvaile vähintään kolme merkkiä.
quiz_q_9 = luettele ruokia, jotka ovat turvallisia koirille ja kissoille, sekä ruokia, jotka ovat vaarallisia.
quiz_q_10 = kerro lyhyt tarina jostakin tuntemastasi koirasta tai kissasta.
quiz_q_11 = mitkä ovat tärkeimmät erot koiran ja kissan päivittäisen hoidon välillä?
quiz_q_12 = miksi varhainen sosiaalistaminen on tärkeää kissanpennuille, ja miten tekisit sen?
quiz_correct_msg_1 = hieno vastaus! juuri tätä haimme.
quiz_correct_msg_2 = aivan oikein. tunnet selvästi lemmikkisi.
quiz_correct_msg_3 = erinomaista — hyvin perusteltu ja tarkka.
quiz_correct_msg_4 = oikein. hienosti selitetty.
quiz_incorrect_msg_1 = ei aivan. yritä lähestyä asiaa toisesta näkökulmasta.
quiz_incorrect_msg_2 = lähellä, mutta vastaus kaipaa lisää yksityiskohtia.
quiz_incorrect_msg_3 = tämä ei ollut odotettu vastaus — kertaa aihetta ja yritä myöhemmin uudelleen.
quiz_incorrect_msg_4 = hmm, tämä ei vaikuta oikealta. tarkista luotettavasta lähteestä.

analysis_section_title = käyttäytymisanalyysi (ehdotus opettajalle)
analysis_no_data = käyttäytymisanalyysiä ei ole vielä saatavilla.
analysis_alert_title = vain ehdotus — ei todiste vilpistä
analysis_alert_body = alla olevat mittarit kuvaavat, kuinka paljon opiskelijan käyttäytyminen muistuttaa <em>tyypillistä</em> vilppiä. ne <strong>eivät</strong> vahvista, että opiskelija olisi vilpistänyt. jokainen signaali voi laueta myös täysin laillisesta toiminnasta. käytä omaa harkintaasi, opiskelijan tilannetta ja itse vastauksia ennen johtopäätösten tekemistä.
analysis_score_label = käyttäytymisen samankaltaisuus vilppikuvioiden kanssa:
analysis_score_tooltip = tämä pistemäärä kertoo, kuinka paljon opiskelijan käyttäytyminen muistuttaa tunnettuja vilppikuvioita. se ei ole todennäköisyys siitä, että opiskelija olisi vilpistänyt.
analysis_score_aria = mitä tämä pistemäärä tarkoittaa?
analysis_band_low = matala samankaltaisuus
analysis_band_mid = jonkin verran samankaltaisuutta
analysis_band_high = korkea samankaltaisuus
analysis_band_low_hint = käyttäytyminen muistuttaa pääosin tavallista kokeen tekijää.
analysis_band_mid_hint = muutamat kuviot ovat samankaltaisia vilppikäyttäytymisen kanssa, mutta on monia viattomia selityksiä.
analysis_band_high_hint = käyttäytyminen vastaa merkittävästi vilpissä havaittuja kuvioita — kannattaa tarkastella manuaalisesti tarkemmin.
analysis_breakdown_summary = signaalierittely & miten tulkita kutakin niistä
analysis_breakdown_intro = jokainen rivi on yksittäinen käyttäytymissignaali. korkea arvo tarkoittaa, että käyttäytyminen havaittiin voimakkaasti — se ei yksinään tarkoita, että opiskelija olisi vilpistänyt.
analysis_breakdown_footer = muistutus: tämä analyysi kuvaa vain <em>kuinka vilpistäjämäisesti</em> opiskelija käyttäytyi. korkea pistemäärä on kehotus tarkastella tarkemmin — ei koskaan tuomio.
analysis_factor_weighted = {0}% · painotettu {1}
analysis_innocent_cause_label = mahdollinen viaton syy:
analysis_reliability_high = vahvempi signaali
analysis_reliability_medium = kohtalainen signaali
analysis_reliability_low = heikko signaali – altis vääriin hälytyksiin
analysis_factor_copy_paste_label = kopioitu kysymys → liitetty vastaus
analysis_factor_copy_paste_desc = opiskelija kopioi tekstiä kysymyksestä ja liitti pian sen jälkeen vastauksen, jonka kielellinen sisältö liittyi siihen läheisesti. tämä on tämän analyysin vahvin käyttäytymisindikaattori vilpistä.
analysis_factor_copy_paste_innocent = voi laueta myös laillisesta käyttäytymisestä, esim. kysymyksen kopioimisesta määritelmän etsimistä varten tai liittämisestä omiin muistiinpanoihin.
analysis_factor_ai_label = tekoälymäiset kirjoitustunnukset
analysis_factor_ai_desc = lähetetty teksti sisältää emojeita, välimerkkejä tai muotoilukuvioita, joita tekoälyavustajat tuottavat yleisesti.
analysis_factor_ai_innocent = laukeaa helposti, kun opiskelija aidosti keskustelee tekoälystä, lainaa tekoälyn tuottamaa tekstiä tai hänen kirjoitustyylinsä vain muistuttaa yleistä tekoälymuotoilua.
analysis_factor_unmodified_label = muokkaamattomat liitokset
analysis_factor_unmodified_desc = opiskelija liitti sisältöä vastauskenttään muokkaamatta sitä jälkikäteen.
analysis_factor_unmodified_innocent = laukeaa mistä tahansa ulkoisesta liitoksesta, mukaan lukien lailliset käyttötarkoitukset kuten kääntäjä, ruudunlukijan työnkulku tai opiskelijan omista muistiinpanoista liittäminen.
analysis_factor_tabs_label = välilehtien vaihto yhdistettynä liittämiseen
analysis_factor_tabs_desc = opiskelija poistui toistuvasti kokeen välilehdeltä ja palasi liitetyn sisällön kanssa.
analysis_factor_tabs_innocent = voi johtua myös kääntäjän, sanakirjan, esteettömyystyökalun tai toisen laitteen käytöstä, johon opiskelija viittaa toisen välilehden kautta.