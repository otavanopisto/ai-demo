pet_quiz = pet quiz

quiz_title = pet quiz: dogs & cats
quiz_intro = answer the following questions about dogs and cats. once you submit an answer it will be locked and you will receive feedback.
quiz_submit = submit answer
quiz_reset = reset all answers
quiz_correct_label = correct
quiz_incorrect_label = needs improvement
quiz_answer_placeholder = type your answer here...
quiz_q_1 = where is the Siberian Husky breed originally from?
quiz_q_2 = what is the average lifespan of an indoor cat?
quiz_q_3 = why do cats purr? describe the possible reasons.
quiz_q_4 = describe how a dog's sense of smell compares to a human's, and give an example of how this is used.
quiz_q_5 = what is the function of a cat's whiskers?
quiz_q_6 = what was the name of the first dog in space?
quiz_q_7 = share one tip you would give to someone training a puppy for the first time.
quiz_q_8 = how can you tell if a cat is feeling relaxed versus threatened? describe at least three signs.
quiz_q_9 = list foods that are safe for dogs and cats, and foods that are dangerous.
quiz_q_10 = tell us a short story about a dog or cat you have known.
quiz_q_11 = what are the main differences in daily care needs between a dog and a cat?
quiz_q_12 = why is early socialization important for kittens, and how would you do it?
quiz_correct_msg_1 = great answer! that matches what we were looking for.
quiz_correct_msg_2 = spot on. you clearly know your pets.
quiz_correct_msg_3 = excellent — well reasoned and accurate.
quiz_correct_msg_4 = correct. nicely explained.
quiz_incorrect_msg_1 = not quite. try thinking about it from another angle.
quiz_incorrect_msg_2 = close, but the answer needs more detail.
quiz_incorrect_msg_3 = that's not what we expected — review the topic and try again later.
quiz_incorrect_msg_4 = hmm, that doesn't seem right. consider checking a reliable source.

analysis_section_title = behavioural analysis (suggestion for the teacher)
analysis_no_data = no behavioural analysis available yet.
analysis_alert_title = suggestion only — not proof of cheating
analysis_alert_body = the metrics below describe how closely the student's behaviour resembles patterns that are <em>typical</em> of cheating. they do <strong>not</strong> confirm that the student cheated. each signal can also be triggered by perfectly legitimate activity. please use your own judgement, the student's context, and the answers themselves before drawing any conclusion.
analysis_score_label = behavioural similarity to cheating patterns:
analysis_score_tooltip = this score reflects how much the student's behaviour resembles known cheating patterns. it is not a probability that the student cheated.
analysis_score_aria = what does this score mean?
analysis_band_low = low similarity
analysis_band_mid = some similarity
analysis_band_high = high similarity
analysis_band_low_hint = behaviour mostly looks like an ordinary test-taker.
analysis_band_mid_hint = a few patterns overlap with cheating behaviour, but many innocent explanations exist.
analysis_band_high_hint = behaviour overlaps significantly with patterns seen in cheating — worth a closer manual review.
analysis_breakdown_summary = signal breakdown & how to interpret each one
analysis_breakdown_intro = each row is an individual behavioural signal. a high value means the behaviour was observed strongly — it does not, on its own, mean the student cheated.
analysis_breakdown_footer = reminder: this analysis only describes <em>how cheater-like</em> the observed behaviour was. a high score is a prompt to take a closer look — never a verdict.
analysis_factor_weighted = {0}% · weighted {1}
analysis_innocent_cause_label = possible innocent cause:
analysis_reliability_high = stronger signal
analysis_reliability_medium = moderate signal
analysis_reliability_low = weak signal – prone to false positives
analysis_factor_copy_paste_label = copied question → pasted answer
analysis_factor_copy_paste_desc = the student copied text from a question and, shortly after, pasted an answer with closely related linguistic content. this is the strongest behavioural indicator of cheating in this analysis.
analysis_factor_copy_paste_innocent = can still be triggered by legitimate behaviour, e.g. copying a question to look up a definition or to paste it into a personal notes app.
analysis_factor_ai_label = AI-style writing signatures
analysis_factor_ai_desc = the submitted text contains emojis, punctuation, or formatting patterns commonly produced by AI assistants.
analysis_factor_ai_innocent = easily triggered when the student is genuinely discussing AI, quoting AI output, or simply has a writing style that mirrors common AI formatting.
analysis_factor_unmodified_label = unmodified pastes
analysis_factor_unmodified_desc = the student pasted content into the answer field without editing it afterwards.
analysis_factor_unmodified_innocent = triggers for any external paste, including legitimate uses such as a translator, a screen reader workflow, or pasting from the student's own notes.
analysis_factor_tabs_label = tab switching combined with pasting
analysis_factor_tabs_desc = the student repeatedly left the test tab and returned with pasted content.
analysis_factor_tabs_innocent = can also be caused by use of a translator, dictionary, accessibility tool, or a second device the student references through another tab.

